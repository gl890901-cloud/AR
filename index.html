<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR - Visor 3D Proporcional desde GitHub</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b1a;
        }
        .controls-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            color: white;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-height: 45vh;
            overflow-y: auto;
        }
        .transform-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            color: white;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        @media (max-width: 600px) {
            .transform-panel {
                top: auto;
                bottom: 20px;
                right: 20px;
                left: 20px;
                width: auto;
                max-height: 40vh;
                overflow-y: auto;
            }
            .controls-panel {
                top: 20px;
                bottom: auto;
                left: 20px;
                right: 20px;
                max-height: 40vh;
            }
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }
        .slider-row span { width: 80px; color: #aaa; }
        .slider-row input[type="range"] { flex: 1; accent-color: #4c9aff; }
        .slider-row label { width: 30px; text-align: right; font-family: monospace; }
        
        input[type="text"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid #4c9aff;
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
        }
        .qr-container {
            background: white;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        #qrcode img, #qrcode canvas { width: 130px; height: 130px; }
        button {
            background: #4c9aff;
            border: none;
            padding: 10px 14px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-size: 13px;
            width: 100%;
        }
        button:hover { background: #3a7fcc; }
        .status {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 12px;
            font-size: 11px;
            text-align: center;
            word-break: break-all;
            border-left: 4px solid #4c9aff;
        }
        .btn-group { display: flex; gap: 8px; }
        .danger-btn { background: #aa3e3e; }
        .danger-btn:hover { background: #8b2f2f; }
        .success-btn { background: #2e8b57; }
        .success-btn:hover { background: #236b45; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"></script>
</head>
<body>

    <div class="controls-panel" id="controlsPanel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>📷 AR GitHub Engine</h3>
            <span style="font-size:11px; color:#4c9aff; font-weight: bold;">v6.0</span>
        </div>
        
        <div class="input-group">
            <input type="text" id="githubUrlInput" placeholder="URL de GitHub (ej: .../modelo.glb)">
        </div>
        
        <button id="generateQRBtn" class="success-btn">🔲 Vincular y Generar QR</button>
        
        <div class="qr-container" id="qrContainer" style="display: none;">
            <div id="qrcode"></div>
            <button id="downloadQRBtn">📥 Descargar QR</button>
        </div>
        
        <div class="status" id="statusMsg">⚡ Listo para recibir modelos públicos de GitHub.</div>

        <div class="btn-group">
            <button id="startARBtn">🌟 Activar Cámara</button>
            <button id="resetCameraBtn" class="danger-btn">🔄 Entorno</button>
        </div>
    </div>

    <div class="transform-panel" id="transformPanel">
        <h4 style="margin: 0 0 5px 0; color: #4c9aff;">🕹️ Herramientas del Modelo</h4>
        <p style="margin: 0 0 10px 0; font-size: 11px; color: #aaa;">Ajusta cómo se verá respecto al origen (QR)</p>
        
        <div class="slider-row">
            <span>Altura (Y)</span>
            <input type="range" id="posY" min="-2" max="3" step="0.05" value="0">
            <label id="valPosY">0.0</label>
        </div>
        
        <div class="slider-row">
            <span>Mover X</span>
            <input type="range" id="posX" min="-2" max="2" step="0.05" value="0">
            <label id="valPosX">0.0</label>
        </div>

        <div class="slider-row">
            <span>Mover Z</span>
            <input type="range" id="posZ" min="-2" max="2" step="0.05" value="0">
            <label id="valPosZ">0.0</label>
        </div>

        <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:5px 0;">

        <div class="slider-row">
            <span>Girar (Y)</span>
            <input type="range" id="rotY" min="0" max="360" step="1" value="0">
            <label id="valRotY">0°</label>
        </div>

        <div class="slider-row">
            <span>Tamaño</span>
            <input type="range" id="scaleAll" min="0.1" max="3" step="0.05" value="1">
            <label id="valScale">1.0</label>
        </div>
        
        <button id="resetTransformBtn" style="background:#333; padding:6px; font-size:11px; margin-top:5px;">🔄 Centrar Valores</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        
        // Elementos DOM
        const githubUrlInput = document.getElementById('githubUrlInput');
        const generateQRBtn = document.getElementById('generateQRBtn');
        const qrContainerDiv = document.getElementById('qrContainer');
        const qrcodeDiv = document.getElementById('qrcode');
        const downloadQRBtn = document.getElementById('downloadQRBtn');
        const statusMsg = document.getElementById('statusMsg');
        const startARBtn = document.getElementById('startARBtn');
        const resetCameraBtn = document.getElementById('resetCameraBtn');
        
        // Sliders Dom
        const sliderPosX = document.getElementById('posX');
        const sliderPosY = document.getElementById('posY');
        const sliderPosZ = document.getElementById('posZ');
        const sliderRotY = document.getElementById('rotY');
        const sliderScale = document.getElementById('scaleAll');
        const resetTransformBtn = document.getElementById('resetTransformBtn');

        let scene, camera, renderer, controls, arSessionActive = false;
        let currentModel = null, modelContainer = null, qrAnchorMesh = null;

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0b1a);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 4);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0.5, 0);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Contenedor principal que hereda las transformaciones manuales
            modelContainer = new THREE.Group();
            scene.add(modelContainer);

            // Crear Ancla del QR ficticia en el suelo (Punto Cero del Espacio Real)
            const qrGeo = new THREE.PlaneGeometry(0.6, 0.6);
            const qrMat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.9
            });
            qrAnchorMesh = new THREE.Mesh(qrGeo, qrMat);
            qrAnchorMesh.rotation.x = -Math.PI / 2;
            qrAnchorMesh.position.y = -0.01; // Justo en el suelo
            scene.add(qrAnchorMesh);

            // Cuadrícula base
            const gridHelper = new THREE.GridHelper(20, 40, 0x4c9aff, 0x1d2436);
            scene.add(gridHelper);
            
            window.addEventListener('resize', onWindowResize);
            setupSliders();
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function convertToRawGitHubUrl(url) {
            let processedUrl = url.trim();
            if (processedUrl.includes("github.com")) {
                processedUrl = processedUrl.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
            }
            return processedUrl;
        }

        // Lógica de manipulación de sliders vinculados al contenedor del modelo
        function setupSliders() {
            const updateTransform = () => {
                if (!modelContainer) return;
                
                // Aplicar posición
                modelContainer.position.x = parseFloat(sliderPosX.value);
                modelContainer.position.y = parseFloat(sliderPosY.value);
                modelContainer.position.z = parseFloat(sliderPosZ.value);
                
                // Aplicar rotación (convertida a radianes)
                modelContainer.rotation.y = THREE.MathUtils.degToRad(parseFloat(sliderRotY.value));
                
                // Aplicar escala
                const s = parseFloat(sliderScale.value);
                modelContainer.scale.set(s, s, s);

                // Imprimir feedback visual en las etiquetas
                document.getElementById('valPosX').innerText = sliderPosX.value;
                document.getElementById('valPosY').innerText = sliderPosY.value;
                document.getElementById('valPosZ').innerText = sliderPosZ.value;
                document.getElementById('valRotY').innerText = sliderRotY.value + "°";
                document.getElementById('valScale').innerText = sliderScale.value;
            };

            sliderPosX.addEventListener('input', updateTransform);
            sliderPosY.addEventListener('input', updateTransform);
            sliderPosZ.addEventListener('input', updateTransform);
            sliderRotY.addEventListener('input', updateTransform);
            sliderScale.addEventListener('input', updateTransform);

            resetTransformBtn.addEventListener('click', () => {
                sliderPosX.value = 0; sliderPosY.value = 0; sliderPosZ.value = 0;
                sliderRotY.value = 0; sliderScale.value = 1;
                updateTransform();
            });
        }

        function loadModelFromUrl(url) {
            return new Promise((resolve, reject) => {
                let loaderPromise;
                statusMsg.innerText = `🔄 Obteniendo geometría desde GitHub...`;

                const isObj = url.toLowerCase().includes(".obj");

                if (isObj) {
                    const loader = new OBJLoader();
                    loaderPromise = loader.loadAsync(url);
                } else {
                    const loader = new GLTFLoader();
                    loader.setCrossOrigin('anonymous');
                    loaderPromise = loader.loadAsync(url).then(gltf => gltf.scene);
                }

                loaderPromise.then(model => {
                    // Limpiar modelo anterior dentro del contenedor
                    while(modelContainer.children.length > 0){ 
                        modelContainer.remove(modelContainer.children[0]); 
                    }
                    
                    currentModel = model;
                    
                    // Auto-centrado de geometría inicial
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    
                    // Ajustamos el pivote para que la base del objeto toque el suelo por defecto
                    currentModel.position.set(-center.x, -box.min.y, -center.z);
                    
                    modelContainer.add(currentModel);
                    resolve();
                }).catch(reject);
            });
        }

        generateQRBtn.addEventListener('click', () => {
            const rawUrl = githubUrlInput.value.trim();
            if (!rawUrl) {
                statusMsg.innerText = "❌ URL de GitHub requerida.";
                return;
            }

            const rawBlobUrl = convertToRawGitHubUrl(rawUrl);
            const baseUrl = window.location.href.split('#')[0];
            
            // Pasamos la URL del modelo codificada en el hash del teléfono remoto
            const appShareUrl = `${baseUrl}#modelUrl=${encodeURIComponent(rawBlobUrl)}`;
            
            qrcodeDiv.innerHTML = "";
            new QRCode(qrcodeDiv, {
                text: appShareUrl,
                width: 130,
                height: 130,
                correctLevel: QRCode.CorrectLevel.M
            });
            
            qrContainerDiv.style.display = "flex";
            statusMsg.innerText = "✅ ¡QR Proporcional Generado!";

            // Actualizar la textura del ancla del suelo 3D con el QR generado para referencia visual espacial
            setTimeout(() => {
                const qrCanvas = qrcodeDiv.querySelector('canvas');
                if (qrCanvas) {
                    const texture = new THREE.CanvasTexture(qrCanvas);
                    qrAnchorMesh.material.map = texture;
                    qrAnchorMesh.material.needsUpdate = true;
                }
            }, 300);
            
            loadModelFromUrl(rawBlobUrl)
                .then(() => statusMsg.innerText = "✅ Modelo sincronizado. Usa las herramientas para acomodarlo respecto al QR.")
                .catch(err => statusMsg.innerText = `❌ Error de renderizado. Verifica el repositorio.`);
        });

        downloadQRBtn.addEventListener('click', () => {
            const canvas = qrcodeDiv.querySelector('canvas');
            if (canvas) {
                const link = document.createElement('a');
                link.download = `ar-spatial-qr.png`;
                link.href = canvas.toDataURL();
                link.click();
            }
        });

        async function startARMode() {
            if (!currentModel) return;
            if (arSessionActive) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const video = document.createElement('video');
                video.autoplay = true; video.playsInline = true; video.srcObject = stream; video.id = "webcam-ar-feed";
                video.style = "position:fixed; top:0; left:0; width:100vw; height:100vh; object-fit:cover; z-index:-2;";
                document.body.appendChild(video);
                
                renderer.setClearColor(0x000000, 0);
                scene.background = null;
                qrAnchorMesh.visible = false; // Ocultamos el plano QR virtual ya que usarás el papel real
                
                arSessionActive = true;
                window.__cameraStream = stream;
                statusMsg.innerText = "🌟 Vista AR activada. Los sliders modifican la posición relativa al tracking.";
            } catch (err) {
                statusMsg.innerText = `❌ Error de cámara: ${err.message}`;
            }
        }

        function resetAR() {
            const video = document.getElementById('webcam-ar-feed');
            if (video) video.remove();
            if (window.__cameraStream) {
                window.__cameraStream.getTracks().forEach(track => track.stop());
                window.__cameraStream = null;
            }
            renderer.setClearColor(0x0b0b1a, 1);
            scene.background = new THREE.Color(0x0b0b1a);
            qrAnchorMesh.visible = true;
            arSessionActive = false;
        }

        startARBtn.addEventListener('click', startARMode);
        resetCameraBtn.addEventListener('click', resetAR);

        function checkUrlParamsOnLoad() {
            const hash = window.location.hash.substring(1);
            if (!hash) return;
            const params = new URLSearchParams(hash);
            const modelUrl = params.get('modelUrl');
            if (modelUrl) {
                loadModelFromUrl(decodeURIComponent(modelUrl))
                    .then(() => statusMsg.innerText = `📲 Sincronizado remotamente por QR.`)
                    .catch(console.error);
            }
        }

        initThree();
        checkUrlParamsOnLoad();
    </script>
</body>
</html>
