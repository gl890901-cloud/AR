<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR - Generador y Tracking sobre QR</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b1a;
        }
        /* Panel Principal de Control (Computadora) */
        .controls-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            color: white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-height: 45vh;
            overflow-y: auto;
        }
        /* Panel de Sliders */
        .transform-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            color: white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        @media (max-width: 600px) {
            .transform-panel {
                top: auto;
                bottom: 20px;
                right: 20px;
                left: 20px;
                width: auto;
                max-height: 35vh;
            }
            .controls-panel {
                top: 20px;
                bottom: auto;
                left: 20px;
                right: 20px;
                max-height: 35vh;
            }
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }
        .slider-row span { width: 80px; color: #aaa; }
        .slider-row input[type="range"] { flex: 1; accent-color: #4c9aff; }
        .slider-row label { width: 30px; text-align: right; font-family: monospace; }
        
        input[type="text"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid #4c9aff;
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            width: 93%;
        }
        .qr-container {
            background: white;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: fit-content;
            margin: 0 auto;
        }
        #qrcode img, #qrcode canvas { width: 140px; height: 140px; }
        button {
            background: #4c9aff;
            border: none;
            padding: 10px 14px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13px;
            width: 100%;
        }
        button:hover { background: #3a7fcc; }
        .status {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 12px;
            font-size: 11px;
            text-align: center;
            word-break: break-all;
            border-left: 4px solid #4c9aff;
        }
        /* Capa exclusiva del Teléfono */
        .phone-overlay {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 2000;
            text-align: center;
            pointer-events: none;
            display: none;
            border: 1px solid #4c9aff;
        }
        /* Ocultar elementos nativos de A-frame que estorban */
        .a-enter-vr { display: none !important; }
    </style>
</head>
<body>

    <div class="phone-overlay" id="phoneOverlay">
        📷 Enfoca el código QR impreso o en pantalla para proyectar el objeto
    </div>

    <div class="controls-panel" id="controlsPanel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>📷 AR Target QR Engine</h3>
            <span style="font-size:11px; color:#4c9aff; font-weight: bold;">v7.0</span>
        </div>
        
        <input type="text" id="githubUrlInput" placeholder="URL de GitHub de tu .glb">
        <button id="generateQRBtn" style="background: #2e8b57;">🔲 Generar QR y Activar Sistema</button>
        
        <div class="qr-container" id="qrContainer" style="display: none;">
            <div id="qrcode"></div>
            <button id="downloadQRBtn" style="background: #333; margin-top:5px;">📥 Descargar QR</button>
        </div>
        
        <div class="status" id="statusMsg">⚡ Listo. Pega el enlace de GitHub para vincular tu geometría espacial.</div>
    </div>

    <div class="transform-panel" id="transformPanel">
        <h4 style="margin: 0 0 5px 0; color: #4c9aff;">🕹️ Offset respecto al QR</h4>
        <p style="margin: 0 0 10px 0; font-size: 11px; color: #aaa;">Ajusta dónde flotará el modelo sobre el código</p>
        
        <div class="slider-row">
            <span>Altura (Y)</span>
            <input type="range" id="posY" min="-1" max="4" step="0.05" value="0">
            <label id="valPosY">0.0</label>
        </div>
        <div class="slider-row">
            <span>Desplazar X</span>
            <input type="range" id="posX" min="-2" max="2" step="0.05" value="0">
            <label id="valPosX">0.0</label>
        </div>
        <div class="slider-row">
            <span>Desplazar Z</span>
            <input type="range" id="posZ" min="-2" max="2" step="0.05" value="0">
            <label id="valPosZ">0.0</label>
        </div>
        <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:5px 0;">
        <div class="slider-row">
            <span>Girar (Y)</span>
            <input type="range" id="rotY" min="0" max="360" step="1" value="0">
            <label id="valRotY">0°</label>
        </div>
        <div class="slider-row">
            <span>Tamaño</span>
            <input type="range" id="scaleAll" min="0.05" max="3" step="0.05" value="0.5">
            <label id="valScale">0.5</label>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        renderer="logarithmicDepthBuffer: true; colorManagement: true;"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;">
        
        <a-assets id="assetsContainer"></a-assets>

        <a-marker type="barcode" value="5" id="qrTargetMarker">
            <a-entity id="modelWrapper" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5">
                <a-entity id="gltfModelMesh"></a-entity>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const githubUrlInput = document.getElementById('githubUrlInput');
        const generateQRBtn = document.getElementById('generateQRBtn');
        const qrContainerDiv = document.getElementById('qrContainer');
        const qrcodeDiv = document.getElementById('qrcode');
        const downloadQRBtn = document.getElementById('downloadQRBtn');
        const statusMsg = document.getElementById('statusMsg');
        
        const controlsPanel = document.getElementById('controlsPanel');
        const transformPanel = document.getElementById('transformPanel');
        const phoneOverlay = document.getElementById('phoneOverlay');

        const modelWrapper = document.getElementById('modelWrapper');
        const gltfModelMesh = document.getElementById('gltfModelMesh');
        const assetsContainer = document.getElementById('assetsContainer');

        // Sliders
        const sliderPosX = document.getElementById('posX');
        const sliderPosY = document.getElementById('posY');
        const sliderPosZ = document.getElementById('posZ');
        const sliderRotY = document.getElementById('rotY');
        const sliderScale = document.getElementById('scaleAll');

        // Sincronizar Sliders de Ajuste Fino en Vivo
        function initSliders() {
            const updateTransform = () => {
                const x = sliderPosX.value;
                const y = sliderPosY.value;
                const z = sliderPosZ.value;
                const rY = sliderRotY.value;
                const s = sliderScale.value;

                modelWrapper.setAttribute('position', `${x} ${y} ${z}`);
                modelWrapper.setAttribute('rotation', `0 ${rY} 0`);
                modelWrapper.setAttribute('scale', `${s} ${s} ${s}`);

                document.getElementById('valPosX').innerText = x;
                document.getElementById('valPosY').innerText = y;
                document.getElementById('valPosZ').innerText = z;
                document.getElementById('valRotY').innerText = rY + "°";
                document.getElementById('valScale').innerText = s;
            };

            [sliderPosX, sliderPosY, sliderPosZ, sliderRotY, sliderScale].forEach(sl => {
                sl.addEventListener('input', updateTransform);
            });
        }

        function convertToRawGitHubUrl(url) {
            let processedUrl = url.trim();
            if (processedUrl.includes("github.com")) {
                processedUrl = processedUrl.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
            }
            return processedUrl;
        }

        // Cargar geometría de forma asíncrona dentro del ecosistema AR.js
        function injectModel(url) {
            // Limpiar ejecuciones previas
            assetsContainer.innerHTML = "";
            gltfModelMesh.removeAttribute('gltf-model');

            statusMsg.innerText = "🔄 Sincronizando y descargando geometría 3D...";

            const assetItem = document.createElement('a-asset-item');
            assetItem.setAttribute('id', 'active-gltf');
            assetItem.setAttribute('src', url);
            assetsContainer.appendChild(assetItem);

            gltfModelMesh.setAttribute('gltf-model', '#active-gltf');

            gltfModelMesh.addEventListener('model-loaded', () => {
                statusMsg.innerText = "✅ ¡Modelo 3D listo sobre el objetivo QR!";
            });
        }

        // Lógica de Generación de QR del Maestro
        generateQRBtn.addEventListener('click', () => {
            const rawUrl = githubUrlInput.value.trim();
            if (!rawUrl) {
                statusMsg.innerText = "❌ Pega una URL válida de GitHub.";
                return;
            }

            const rawBlobUrl = convertToRawGitHubUrl(rawUrl);
            const baseUrl = window.location.href.split('#')[0];
            
            // Pasamos los parámetros de posición guardados en los sliders mediante el QR
            const appShareUrl = `${baseUrl}#modelUrl=${encodeURIComponent(rawBlobUrl)}&x=${sliderPosX.value}&y=${sliderPosY.value}&z=${sliderPosZ.value}&r=${sliderRotY.value}&s=${sliderScale.value}`;
            
            qrcodeDiv.innerHTML = "";
            new QRCode(qrcodeDiv, {
                text: appShareUrl,
                width: 140,
                height: 140,
                correctLevel: QRCode.CorrectLevel.M
            });
            
            qrContainerDiv.style.display = "flex";
            injectModel(rawBlobUrl);
        });

        // Detectar si la página se está ejecutando desde el Teléfono (Tiene parámetros en la URL)
        function checkClientDevice() {
            const hash = window.location.hash.substring(1);
            if (!hash) return; // Es la computadora maestro, se queda como interfaz de desarrollo

            const params = new URLSearchParams(hash);
            const modelUrl = params.get('modelUrl');

            if (modelUrl) {
                // Ocultar paneles de configuración para dejar limpia la pantalla de la cámara
                controlsPanel.style.display = "none";
                transformPanel.style.display = "none";
                phoneOverlay.style.display = "block"; // Activar guía telefónica

                // Capturar e inyectar transformaciones preestablecidas por el QR
                const x = params.get('x') || 0;
                const y = params.get('y') || 0;
                const z = params.get('z') || 0;
                const r = params.get('r') || 0;
                const s = params.get('s') || 0.5;

                modelWrapper.setAttribute('position', `${x} ${y} ${z}`);
                modelWrapper.setAttribute('rotation', `0 ${r} 0`);
                modelWrapper.setAttribute('scale', `${s} ${s} ${s}`);

                injectModel(decodeURIComponent(modelUrl));
            }
        }

        downloadQRBtn.addEventListener('click', () => {
            const canvas = qrcodeDiv.querySelector('canvas');
            if (canvas) {
                const link = document.createElement('a');
                link.download = `ar-target-qr.png`;
                link.href = canvas.toDataURL();
                link.click();
            }
        });

        // Inicialización de hilos
        initSliders();
        checkClientDevice();
    </script>
</body>
</html>
